[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathtail"
version = "0.1.3"
description = "Exact score-companion constructions for finite forecast sampling"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{name = "Anonymous PATHTAIL authors"}]
dependencies = ["numpy>=2.3.5,<3", "sympy>=1.14,<2"]

[project.urls]
Repository = "https://anonymous.4open.science/r/path-7901"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["pathtail"]

[tool.coverage.report]
show_missing = true
fail_under = 95
