[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathtail"
version = "0.1.4"
description = "Exact score-companion constructions for finite forecast sampling"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Anonymous PATHTAIL authors"}]
dependencies = ["numpy>=2.3.5,<3", "sympy>=1.14,<2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://anonymous.4open.science/r/path-7901"

[tool.setuptools.packages.find]
where = ["src"]
